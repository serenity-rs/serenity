[package]
name = "serenity-core"
version = "0.12.5"

documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true


[dependencies]
bitflags = "2.10.0"
base64 = { version = "0.22.1" }
serde_json = "1.0.147"
serde = { version = "1.0.228", features = ["derive", "rc"] }
nonmax = { version = "0.5.5", features = ["serde"] }
to-arraystring = "0.2.2"
tokio = { version = "1.48.0", features = ["macros", "rt", "sync", "time", "io-util"] }
zeroize = { version = "1.8.2" } # Not used in serenity, but bumps the minimal version from secrecy
time = { version = "0.3.47", features = ["formatting", "parsing", "serde-well-known"] }
strum = { version = "0.27.2", features = ["derive"] }
foldhash = { version = "0.2.0", optional = true }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"], optional = true }
dashmap = { version = "6.1.0", features = ["serde"], optional = true }
mime_guess = { version = "2.0.5", optional = true }
mime = { version = "0.3.16", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
small-fixed-array = { version = "0.4", features = ["serde"] }
bool_to_bitflags = { version = "0.1.3" }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
reqwest = { version = ">=0.13", default-features = false, features = ["multipart", "stream", "json"], optional = true }
tokio-tungstenite = { version = "0.28.0", optional = true }
typesize = { version = "0.1.14", optional = true, features = ["url", "time", "serde_json", "secrecy", "parking_lot", "nonmax"] }
extract_map = { version = "0.3.1", features = ["serde"] }
serde_cow = { version = "0.1.2" }
aformat = "0.1.8"
arrayvec = { version = "0.7.6", features = ["serde"] }
url = { version = "2.5.7", features = ["serde"] }
bytes = "1.11.0"
ref-cast = "1.0.25"
parking_lot = { version = "0.12.5"}
mini-moka = { version = "0.10.3", optional = true }
tracing = { version = "0.1.40", features = ["log"] }

[dev-dependencies.http_crate]
version = "1.4.0"
package = "http"

[features]
default = ["cache", "chrono", "model", "rustls_backend"]

builder = ["tokio/fs"]
cache = ["foldhash", "dashmap"]
http = ["dashmap", "mime", "mime_guess", "percent-encoding"]
model = ["builder", "http", "utils"]
utils = []
chrono = ["dep:chrono", "typesize?/chrono"]
typesize = ["dep:typesize", "dashmap/typesize", "small-fixed-array/typesize", "bool_to_bitflags/typesize", "extract_map/typesize"]

unstable = []
tracing_instrument = ["tracing/attributes"]
tokio_task_builder = ["tokio/tracing"]

temp_cache = ["cache", "mini-moka", "typesize?/mini_moka", "typesize?/dashmap"]

rustls_backend = ["reqwest/rustls"]
rustls_backend_no_provider = ["reqwest/rustls-no-provider"]
native_tls_backend = ["reqwest/native-tls"]
